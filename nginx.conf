upstream rails    { server spp:3000; }
upstream nodejs   { server sw-nodejs:8000; }
upstream frontend { server sw-js:3000; }

server {
    listen 80;
    server_name pl-api.iiit.ac.in;

    client_max_body_size 50M;

    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # ── Node.js API ───────────────────────────────────────────────────────────

    location /node/api/ {
        proxy_pass http://nodejs;
    }

    # ── Rails ─────────────────────────────────────────────────────────────────

    location /assets/ {
        proxy_pass http://rails;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /system/ {
        proxy_pass http://rails;
    }

    location /v0/ {
        proxy_pass http://rails;
    }

    location /editor/ {
        proxy_pass http://rails;
    }

    location /users/ {
        proxy_pass http://rails;
    }

    location /api/ {
        proxy_pass http://rails;
    }

    # Rails — locale-prefixed routes
    location ~ ^/(en|fr|es|ar|ur|or|fa|hi|mr|kok)/(v0|editor|users)/ {
        proxy_pass http://rails;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────

    location / {
        proxy_pass http://frontend;
    }
}
